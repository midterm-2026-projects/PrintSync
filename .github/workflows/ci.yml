name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: 
    - "main"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the inventory Playwright workflow against the configured E2E database"
        required: true
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────
  # 1. BACKEND
  # ─────────────────────────────────────────────
  backend-tests:
    name: "Backend Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          NODE_ENV: test

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ─────────────────────────────────────────────
  # 2. FRONTEND
  # ─────────────────────────────────────────────
  frontend-tests:
    name: "Frontend Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─────────────────────────────────────────────
  # 3. E2E Tests (runs automatically on push/PR to main)
  # ─────────────────────────────────────────────
  inventory-e2e:
    name: "Inventory E2E"
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == true)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      E2E_RUN: "true"
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Chromium with system deps
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run inventory workflow
        run: npm run test:e2e
        working-directory: frontend
        env:
          SUPABASE_DB_URL: ${{ secrets.E2E_DATABASE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-playwright-report
          path: frontend/playwright-report/


